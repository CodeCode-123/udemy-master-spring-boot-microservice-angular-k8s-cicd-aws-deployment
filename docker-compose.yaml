version: '3.8'
services:
  jenkins:
#    build:
#      context: .
#      dockerfile: Dockerfile
#    container_name: jenkins-server
#    user: root
    build: .
    container_name: jenkins-server
    user: root
      # Overriding the entrypoint allows us to fix the socket permission before Jenkins starts
    entrypoint: >
        /bin/sh -c "
        chmod 666 /var/run/docker.sock &&
        exec /usr/local/bin/jenkins.sh
        "
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      # Ensure the docker CLI is available inside the container if needed
      - /usr/local/bin/docker:/usr/usr/bin/docker

volumes:
  jenkins_home: