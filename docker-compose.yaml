version: '3.8'
services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jenkins-server
    user: root
    # Ensure it targets the native arm64 platform for your M2 Max chip
    platform: linux/arm64
#    build: .
#    container_name: jenkins-server
#    user: "jenkins" # Needed on macOS to read/write to the mounted docker.sock without permission errors
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home: